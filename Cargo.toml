[package]
name = "migration-system"
version = "0.1.0"
edition = "2021"
description = "WordPress -> Strapi migration system (Rust port)"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "gzip", "brotli", "deflate", "http2", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.20"
ego-tree = "0.6"
html-escape = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures = "0.3"
bytes = "1"
csv = "1"
mime_guess = "2"
url = "2"
async-trait = "0.1"
once_cell = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
